<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2086 ナンバタウン 時代博覧祭（プレビュー）</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./src/style.css" />
    <style>
      #fx-white {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      #preview-label {
        position: fixed;
        right: 12px;
        top: 10px;
        font: 600 12px 'M PLUS Rounded 1c', system-ui, sans-serif;
        color: #fff;
        background: rgba(14, 24, 52, 0.6);
        padding: 4px 10px;
        border-radius: 10px;
        pointer-events: none;
        white-space: pre;
      }
      #choice {
        position: fixed;
        left: 50%;
        top: 54%;
        transform: translate(-50%, -50%);
        min-width: 420px;
        font: 700 16px 'M PLUS Rounded 1c', system-ui, sans-serif;
        color: #eaf6ff;
        background: rgba(10, 22, 52, 0.86);
        border: 1px solid rgba(120, 220, 255, 0.6);
        border-radius: 16px;
        padding: 14px 18px;
        box-shadow: 0 0 24px rgba(80, 200, 255, 0.35);
        pointer-events: none;
      }
      #choice .ch-title { font-size: 14px; opacity: 0.8; margin-bottom: 8px; }
      #choice .ch-opt { padding: 6px 10px; border-radius: 10px; margin: 4px 0; }
      #choice .ch-opt.on { background: rgba(110, 220, 255, 0.22); outline: 1px solid rgba(160, 240, 255, 0.8); }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui"></div>
    <div id="preview-label"></div>
    <script type="module" src="./src/stages/future2086/preview.ts"></script>
  </body>
</html>
