name: Deploy to GitHub Pages

# main へ push するたびに、three.js 版（web/）をテスト → ビルドして GitHub Pages へ公開する。
# 公開先: https://tomy1031.github.io/nexmax_chronicle/
# 旧 Godot 版のファイルはリポジトリのルートに参考として残しているが、公開には使わない。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: web

jobs:
  build:
    name: Test and build (three.js)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        # puppeteer-core はブラウザをダウンロードしないので CI でもそのまま入る
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: |
          set -euo pipefail
          npm run build
          touch dist/.nojekyll
          test -s dist/index.html
          ls -lh dist dist/models

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist
          include-hidden-files: true

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
