<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexmax Preview</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #dfdfe0;
        font-family: system-ui, -apple-system, 'Hiragino Sans', sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #hud {
        position: fixed;
        left: 10px;
        top: 8px;
        font-size: 12px;
        color: #334;
        background: rgba(255, 255, 255, 0.7);
        padding: 4px 8px;
        border-radius: 6px;
        white-space: pre;
        pointer-events: none;
      }
      .label {
        position: fixed;
        transform: translate(-50%, 0);
        font-size: 13px;
        font-weight: 600;
        color: #223;
        background: rgba(255, 255, 255, 0.75);
        padding: 2px 8px;
        border-radius: 10px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud"></div>
    <script type="module" src="/src/world/nexmax/preview.ts"></script>
  </body>
</html>
