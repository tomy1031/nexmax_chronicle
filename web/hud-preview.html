<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>近未来 HUD プレビュー（NEXMAX CHRONICLE）</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet" />
    <!-- ゲームと同じ全体の CSS（#ui の指定など）も読み、ぶつからないことを確かめる -->
    <link rel="stylesheet" href="./src/style.css" />
    <style>
      #bg {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      #pv-panel {
        position: fixed;
        right: 8px;
        top: 50%;
        transform: translateY(-50%);
        z-index: 50;
        width: 214px;
        max-height: 92vh;
        overflow: auto;
        padding: 8px;
        border-radius: 10px;
        background: rgba(4, 12, 30, 0.88);
        border: 1px solid rgba(120, 220, 255, 0.4);
        font: 600 12px/1.3 system-ui, 'Hiragino Sans', sans-serif;
        color: #dff4ff;
      }
      #pv-panel h3 {
        margin: 8px 0 4px;
        font-size: 11px;
        letter-spacing: 0.1em;
        color: #7fe6ff;
      }
      #pv-panel button {
        margin: 2px 2px 0 0;
        padding: 4px 7px;
        border-radius: 6px;
        border: 1px solid rgba(120, 220, 255, 0.45);
        background: rgba(20, 70, 140, 0.6);
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
      #pv-panel button:hover {
        background: rgba(40, 120, 200, 0.8);
      }
      #pv-panel .hide {
        float: right;
      }
    </style>
  </head>
  <body>
    <img id="bg" alt="" />
    <div id="ui"></div>
    <div id="pv-panel"></div>
    <script type="module" src="./src/ui/future/preview.ts"></script>
  </body>
</html>
